name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Public repo: GitHub-hosted minutes are free. Do not point this at the
    # persoon-build self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (next start)
        env:
          PORT: '3000'
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npm run smoke || { cat next-start.log; exit 1; }
          curl -sI -H 'Host: www.rogerdhillon.com' http://localhost:3000/experience | tr -d '\r' | grep -qx 'location: https://rogerdhillon.com/experience'
